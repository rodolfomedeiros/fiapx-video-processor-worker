[package]
name = "fiapx-video-processor-worker"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
aws-config = "1.6"
aws-credential-types = "1.2"
aws-sdk-s3 = "1.84"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
lapin = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
tokio = { version = "1.45", features = ["full"] }
tokio-amqp = "2.0"
uuid = { version = "1.17", features = ["v4", "serde"] }
zip = "4.2"
