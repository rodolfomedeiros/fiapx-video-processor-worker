name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: '1.94', components: clippy }
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: docker build .
